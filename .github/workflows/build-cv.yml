name: Build and archive CV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile CV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every PR update gets a preview; source revisions are never cancelled.
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test daily publishing behavior
        run: python3 -m unittest discover -s tests -v

      - name: Set reproducible PDF timestamp
        shell: bash
        run: |
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Compile LaTeX and BibTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          texlive_version: '2025'
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Save the compiled PDF outside the checkout
        run: cp main.pdf "$RUNNER_TEMP/YangZhao_CV.pdf"

      - name: Upload downloadable CV preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: YangZhao_CV-${{ github.sha }}
          path: ${{ runner.temp }}/YangZhao_CV.pdf
          if-no-files-found: error

      - name: Upload compilation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latex-diagnostics-${{ github.run_id }}
          path: |
            main.log
            main.blg
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish PDFs
    needs: build
    # PRs only produce previews. Published PDFs change after a merge to main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.CV_PDF_PUBLISH_KEY }}

      - name: Download the compiled CV
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: YangZhao_CV-${{ github.sha }}
          path: ${{ runner.temp }}/cv-artifact

      - name: Commit latest CV and daily backup
        run: >-
          python3 .github/scripts/publish_cv.py
          --source "$GITHUB_SHA"
          --pdf "$RUNNER_TEMP/cv-artifact/YangZhao_CV.pdf"
          --branch main
